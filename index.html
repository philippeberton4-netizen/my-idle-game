<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idle Amakna</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">Idle Amakna</div>
    <div class="res"><span>💰 <b id="res-kamas"></b> Kamas</span><span>⭐ <b id="res-xp"></b> XP</span></div>
  </header>

  <nav id="menu"></nav>

  <main id="main">
    <section class="view active" id="view-combat">
      <div id="charpanel" class="panel"></div>
      <div>
        <div class="panel zonebar"><b id="zone-name"></b><span id="zone-room"></span></div>
        <div id="scene"><div class="team" id="allies"></div><div class="team" id="enemies"></div></div>
        <div class="panel turn"><span>PA <b>6</b> / 6</span><div class="bar"><i id="turn-fill"></i></div></div>
        <div class="panel"><h3>Journal de combat</h3><div id="log"></div></div>
      </div>
    </section>
  </main>

  <aside id="side">
    <div class="panel"><h3>Session</h3><div id="session"></div></div>
    <div class="panel"><h3>Derniers drops</h3><ul id="drops"></ul></div>
  </aside>

  <footer id="chars"></footer>
</div>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
